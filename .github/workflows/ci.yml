name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes fuel config scripts
      - name: Django checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (network is blocked inside the test suite)
        run: python manage.py test -v 2
      - name: Production settings pass the deploy checklist
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-and-randomness-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  stack:
    # Build the image and run the full production stack (nginx, 3 replicas, Postgres, Redis).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for this run
        run: |
          echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> .env
          echo "POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx (no external map services needed)
        run: |
          set -e
          curl -fsS http://localhost:8080/api/health/ | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/health/live/ | grep -q alive
          curl -fsS "http://localhost:8080/api/places/?q=chi" | grep -q "Chicago, IL"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/route/?start=Chicago')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          test "$(docker compose ps web --format '{{.Status}}' | grep -c healthy)" = 3
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop
        if: always()
        run: docker compose down -v
