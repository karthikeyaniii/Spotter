name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (network is blocked inside the test suite)
        run: python manage.py test -v 2
      - name: Production settings pass the deploy checklist
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-and-randomness-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING
